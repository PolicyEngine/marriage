[project]
name = "marriage-household-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "policyengine-us==1.824.1",
  "fastapi>=0.115,<1",
  "modal>=1,<2",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 88
